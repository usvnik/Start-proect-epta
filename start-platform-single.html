;</script><script>
const all=[...D.internships,...D.hackathons,...D.courses],names={home:'Главная',internships:'Стажировки',hackathons:'Хакатоны',courses:'Курсы',favorites:'Избранное',assistant:'ИИ-помощник'};let page='home',q='',filters={},favs=JSON.parse(localStorage.getItem('start-favorites')||'[]'),msgs=[['bot','Привет! Я помощник СТАРТ. Спроси про стажировки, навыки, резюме или выбор направления.']];const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nav(){ $('#nav').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}function go(p){page=p;q='';filters={};nav();render();scrollTo(0,0)}function toast(s){let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),1700)}function fav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('start-favorites',JSON.stringify(favs));render();toast(favs.includes(id)?'Добавлено в избранное':'Удалено из избранного')}function card(x){let meta=x.type==='internship'?[x.city,x.format,x.salary,x.experience]:x.type==='hackathon'?[x.date,x.place,x.format,x.topic]:[x.level,x.duration,x.price,x.direction];return `<article class="card"><div class="cardtop"><div class="logo" style="background:${safe(x.color)}22;color:${safe(x.color)}">${safe(x.logo)}</div><div><b>${safe(x.company)}</b><div class="small">${x.type==='internship'?'Стажировка':x.type==='hackathon'?'Мероприятие':'Обучение'}</div></div><button class="heart ${favs.includes(x.id)?'on':''}" onclick="fav('${x.id}')">${favs.includes(x.id)?'♥':'♡'}</button></div><h3>${safe(x.title)}</h3><div class="tags">${(x.tags||[x.topic||x.direction]).slice(0,3).map(t=>`<span class="tag">${safe(t)}</span>`).join('')}</div><div class="meta">${meta.map(t=>`<span>· ${safe(t||'—')}</span>`).join('')}</div><div class="bottom"><button class="text" onclick="details('${x.id}')">Подробнее ↗</button><span class="small">${safe(x.direction||x.topic||'')}</span></div></article>`}function details(id){let x=all.find(z=>z.id===id),obj=x.type==='internship'?{'Направление':x.direction,'Город':x.city,'Формат':x.format,'Оплата':x.salary,'Опыт':x.experience,'Срок':x.duration}:x.type==='hackathon'?{'Тематика':x.topic,'Дата':x.date,'Формат':x.format,'Место':x.place,'Условия':x.registration}:{'Направление':x.direction,'Уровень':x.level,'Длительность':x.duration,'Стоимость':x.price};$('#modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)this.innerHTML='' "><div class="modal"><button class="close btn" onclick="$('#modal').innerHTML=''">Закрыть ✕</button><div class="eyebrow">${safe(x.company)}</div><h2>${safe(x.title)}</h2><p>${safe(x.description)}</p><div class="detail">${Object.entries(obj).map(([k,v])=>`<div><span>${k}</span><b>${safe(v)}</b></div>`).join('')}</div>${x.requirements?'<b>Что пригодится</b><ul>'+x.requirements.map(r=>'<li>'+safe(r)+'</li>').join('')+'</ul>':''}<p class="small">${safe(x.source||'Демонстрационные данные')}</p><button class="btn primary" onclick="fav('${x.id}');$('#modal').innerHTML=''">♡ В избранное</button></div></div>`}function section(title,sub,items){return `<section class="section"><div class="wrap"><div class="head"><div class="eyebrow">${sub}</div><h2>${title}</h2></div><div class="grid">${items.map(card).join('')}</div></div></section>`}function render(){let out='';if(page==='home'){out=`<section class="hero"><div class="wrap"><div class="eyebrow">ТВОЙ СЛЕДУЮЩИЙ ШАГ В КАРЬЕРЕ</div><h1>Стажировки, хакатоны и курсы в одном месте</h1><p>Находи возможности, развивай навыки и планируй профессиональный путь — от первых учебных проектов до первой работы.</p><div class="search"><input id="homeq" placeholder="Например, аналитика данных, Яндекс…"><button class="btn primary" onclick="q=$('#homeq').value;go('internships')">Найти возможности →</button></div><div class="companies">Компании: <b>Яндекс</b><b>VK</b><b>Сбер</b><b>Т-Банк</b><b>Авито</b><b>Ozon</b></div></div></section>${section('Популярные стажировки','ВОЗМОЖНОСТИ ДЛЯ СТАРТА',D.internships.slice(0,3))}${section('Ближайшие хакатоны','ПРОВЕРЬ СЕБЯ НА ПРАКТИКЕ',D.hackathons.slice(0,3))}${section('Популярные курсы','РАЗВИВАЙ НАВЫКИ',D.courses.slice(0,3))}<section class="section"><div class="wrap banner"><div><div class="eyebrow">ПЕРСОНАЛЬНЫЙ ПОДБОР</div><h3>Не знаешь, с чего начать?</h3><p>Помощник подберёт возможности под твои интересы.</p></div><button class="btn primary" onclick="go('assistant')">Подобрать для меня →</button></div></section>`}else if(page==='assistant'){out=`<section class="catalog section"><div class="wrap"><div class="head"><div class="eyebrow">КАРЬЕРНЫЙ НАВИГАТОР</div><h2>ИИ-помощник СТАРТ</h2><p>Демонстрационная версия на готовых сценариях, без подключения нейросети.</p></div><div class="chat"><div class="messages">${msgs.map(m=>`<div class="msg ${m[0]==='user'?'user':''}">${safe(m[1])}</div>`).join('')}</div><div class="chatrow"><input id="chatq" placeholder="Например: как найти стажировку без опыта?" onkeydown="if(event.key==='Enter')chatSend()"><button class="btn primary" onclick="chatSend()">Отправить</button></div></div><div class="card"><h3>Персональный подбор</h3><div class="profile"><label class="field">Специальность<input id="spec" placeholder="Например, ПМИ"></label><label class="field">Курс<select id="year"><option>1 курс</option><option selected>2 курс</option><option>3 курс</option><option>4 курс</option></select></label><label class="field">Интересующее направление<select id="interest">${['Аналитика данных','Бизнес-аналитика','Программирование','Маркетинг','Менеджмент','Дизайн','Искусственный интеллект'].map(x=>`<option>${x}</option>`).join('')}</select></label><label class="field">Навыки<input id="skills" placeholder="Excel, SQL, Figma"></label><label class="field">Формат<select id="format"><option>Любой</option><option>Удалённо</option><option>Оф рческий опыт часто не обязателен. Покажи учебные проекты, курсовые, хакатоны и конкретные навыки.';else if(/аналит|направлен/.test(s))a='Попробуй аналитику данных или бизнес-аналитику. Для старта пригодятся Excel, SQL и умение формулировать выводы.';else if(/sql/.test(s))a='Начни с SELECT, WHERE, GROUP BY и JOIN. Затем потренируйся на небольшом наборе данных.';else if(/резюме|портфолио/.test(s))a='Добавь 2–3 учебных проекта: задачу, инструменты, личный вклад и результат. Честно обозначай учебные кейсы.';msgs.push(['user',q],['bot',a]);render()}function recommend(){let interest=$('#interest').value,picks=D.internships.filter(x=>x.direction===interest).slice(0,3);if(!picks.length)picks=D.courses.filter(x=>x.direction===interest).slice(0,3);$('#recs').innerHTML='<h3>Подборка по направлению: '+safe(interest)+'</h3><div class="grid">'+picks.map(card).join('')+'</div>'}nav();render();
</script></body></html>
